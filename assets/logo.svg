<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="codex-cleanup logo">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)"/>

  <!-- bloated JSONL lines, fading as they go -->
  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <line x1="30" y1="34" x2="98" y2="34" stroke-width="8" stroke-opacity="0.95"/>
    <line x1="30" y1="50" x2="86" y2="50" stroke-width="8" stroke-opacity="0.65"/>
    <line x1="30" y1="66" x2="93" y2="66" stroke-width="8" stroke-opacity="0.40"/>
  </g>

  <!-- compression chevron -->
  <path d="M 46 80 L 64 92 L 82 80" stroke="#ffffff" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- the compacted result: one tight line, nothing real lost -->
  <line x1="50" y1="106" x2="78" y2="106" stroke="#ffffff" stroke-width="9"
        stroke-linecap="round"/>
</svg>
